name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run Linter
        working-directory: ${{ matrix.project }}
        run: npm run lint || echo "⚠️ Aucun linter configuré"

      - name: Run Tests with Coverage
        working-directory: ${{ matrix.project }}
        run: npm test -- --coverage || echo "⚠️ Aucun test trouvé"
